<!doctype html>
<html><head>
<meta charset="utf-8"><title>Summary</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
  <header class="topbar"><a href="dashboard.html">← Dashboard</a><h1>Summary</h1></header>
  <main class="container">
    <section>
      <h2>Overall Summary</h2>
      <div id="summary-area">Loading…</div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/firestore.js"></script>
  <script>
    onAuthStateChanged(async user=>{
      if(!user) location.href='index.html';
      const s = await computeSummary();
      document.getElementById('summary-area').innerHTML = s;
    });
  </script>
</body></html>
