<!doctype html>
<html><head>
<meta charset="utf-8"><title>Business</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
  <header class="topbar">
    <a href="dashboard.html">← Dashboard</a>
    <h1>Business</h1>
  </header>
  <main class="container">
    <section>
      <div class="actions">
        <button id="add-customer-btn">Add Customer</button>
      </div>
      <h2>Customers</h2>
      <table id="customers-table">
        <thead><tr><th>Name</th><th>Balance</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/firestore.js"></script>
  <script>
    onAuthStateChanged(user=>{
      if(!user) location.href='index.html';
      loadCustomers();
    });

    document.getElementById('add-customer-btn').addEventListener('click', async ()=>{
      const name = prompt('Customer name');
      if(!name) return;
      const phone = prompt('Phone (optional)');
      await addCustomer({name, phone, createdAt: Date.now(), balance: 0});
      loadCustomers();
    });

    async function loadCustomers(){
      const list = await getCustomers();
      const tbody = document.querySelector('#customers-table tbody');
      tbody.innerHTML = '';
      list.forEach(c=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${c.name}</td><td>${c.balance ?? 0}</td>
          <td>
            <button data-id="${c.id}" class="view-btn">View</button>
            <button data-id="${c.id}" class="tx-btn">Add Tx</button>
          </td>`;
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll('.view-btn').forEach(btn=>{
        btn.addEventListener('click', async (e)=>{
          const id = e.target.dataset.id;
          localStorage.setItem('customerId', id);
          window.location.href = 'customer.html';
        });
      });
      tbody.querySelectorAll('.tx-btn').forEach(btn=>{
        btn.addEventListener('click', async (e)=>{
          const id = e.target.dataset.id;
          const amt = parseFloat(prompt('Amount given to customer (positive) or received from customer (negative)'));
          if(isNaN(amt)) return alert('invalid');
          await addBusinessTransaction(id, {amount: amt, date: Date.now()});
          alert('Saved');
          loadCustomers();
        });
      });
    }
  </script>
</body></html>
