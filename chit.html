<!doctype html>
<html><head>
<meta charset="utf-8"><title>Chits</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
  <header class="topbar"><a href="dashboard.html">← Dashboard</a><h1>Chits</h1></header>
  <main class="container">
    <section>
      <div class="actions"><button id="add-chit-btn">Add New Chit</button></div>
      <h2>Active Chits</h2>
      <ul id="chit-list"></ul>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/firestore.js"></script>
  <script>
    onAuthStateChanged(user=>{
      if(!user) location.href='index.html';
      loadChits();
    });
    document.getElementById('add-chit-btn').addEventListener('click', async ()=>{
      const name = prompt('Chit name'); if(!name) return;
      const value = parseFloat(prompt('Chit value')); if(isNaN(value)) return;
      const members = parseInt(prompt('Number of members')); if(isNaN(members)) return;
      await addChit({name, value, members, createdAt: Date.now(), status: 'active'});
      loadChits();
    });
    async function loadChits(){
      const list = await getChits();
      const ul = document.getElementById('chit-list');
      ul.innerHTML = '';
      list.forEach(c=>{
        const li = document.createElement('li');
        li.innerHTML = `<strong>${c.name}</strong> — ${c.value} — members: ${c.members} — <button data-id="${c.id}" class="view-chit">View</button>`;
        ul.appendChild(li);
      });
      ul.querySelectorAll('.view-chit').forEach(b=>{
        b.addEventListener('click', e=>{
          localStorage.setItem('chitId', e.target.dataset.id);
          window.location.href = 'chit-details.html';
        });
      });
    }
  </script>
</body></html>
