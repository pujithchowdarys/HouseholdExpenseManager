<!doctype html>
<html><head>
<meta charset="utf-8"><title>Loans</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
  <header class="topbar"><a href="dashboard.html">← Dashboard</a><h1>Loans</h1></header>
  <main class="container">
    <section>
      <div class="actions"><button id="add-loan-btn">Add New Loan</button></div>
      <h2>Loans</h2>
      <table id="loans-table"><thead><tr><th>Title</th><th>Balance</th><th>Actions</th></tr></thead><tbody></tbody></table>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/firestore.js"></script>
  <script>
    onAuthStateChanged(user=>{
      if(!user) location.href='index.html';
      loadLoans();
    });
    document.getElementById('add-loan-btn').addEventListener('click', async ()=>{
      const title = prompt('Loan title'); if(!title) return;
      const amount = parseFloat(prompt('Loan principal')); if(isNaN(amount)) return;
      await addLoan({title, principal: amount, balance: amount, createdAt: Date.now()});
      loadLoans();
    });
    async function loadLoans(){
      const list = await getLoans();
      const tbody = document.querySelector('#loans-table tbody');
      tbody.innerHTML = '';
      list.forEach(l=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${l.title}</td><td>${l.balance}</td><td><button data-id="${l.id}" class="view-loan">View</button></td>`;
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll('.view-loan').forEach(b=> b.addEventListener('click', e=>{
        localStorage.setItem('loanId', e.target.dataset.id);
        window.location.href = 'loan-details.html';
      }));
    }
  </script>
</body></html>
